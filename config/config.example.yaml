# jira-auto-dispatcher — central 설정 예시(시크릿 없음).
# config.yaml(gitignore됨)로 복사해 채운다. 시크릿 "값"은 넣지 말 것 —
# 파일 참조(secrets.base_dir 상대 경로)만 둔다.
#
# 사용자별 트리거 목록은 여기가 아니라 레지스트리(state/registry.json)가
# 소유한다(관리 UI 온보딩으로 채워짐). 예시는 config/registry.example.json 참조.

role: central
server: { host: 0.0.0.0, port: 8787 }

jira:
  base_url: https://interx-jira.atlassian.net
  project: HAN
  poll_interval_sec: 60
  watcher_token_file: service/jira-token   # 중앙이 Jira를 감시하는 토큰(내 것/봇). secrets.base_dir 상대

match: { statuses: ["해야 할 일"] }

webhook: { enabled: false, path: /jira-webhook, shared_secret_file: service/webhook-secret }

resume: { work_hours: "08:00-18:00", timezone: Asia/Seoul, nightly_drain: "01:00-05:00", reset_buffer_sec: 120 }

spawn:
  image: jira-auto-dispatcher:latest
  network: jad-net
  central_url: http://central:8787
  mem_limit: 4g
  docker_host: tcp://socket-proxy:2375       # compose 기본(socket-proxy 경유). 직결 대안: unix:///var/run/docker.sock
  run_as: "1000:1000"                         # worker 컨테이너 비-root 실행(특권 축소)
  # ⚠️ 호스트 배포 디렉토리의 절대경로(central 컨테이너 내부 경로 아님).
  # central이 socket-proxy 경유로 worker를 띄우면 바인드 source는 호스트 docker
  # 데몬이 해석한다(sibling container) → worker 바인드 source가 호스트 경로여야 한다.
  # 예: /home/yhchoi/deploy/jira-auto-dispatcher. env HOST_DEPLOY_DIR 폴백 우선.
  # 비우면(로컬 개발) 직접 경로 폴백. worker의 config/시크릿 마운트에 필수.
  host_deploy_dir: "${HOST_DEPLOY_DIR}"

git: { branch_prefix: auto/, github_owner: yunhyuk-choi }   # github은 central만

secrets: { base_dir: "${SECRETS_DIR}" }   # 로컬=C:/temp, 컨테이너=/run/secrets 또는 볼륨

run:
  # worker가 오케스트레이터로 동작할 3개 레포의 로컬 경로(central↔worker 공유).
  orchestrator_repo: /app/orchestrator        # 프레임워크(pristine, read-only)
  dlc_meta_repo: /app/dlc-meta                 # 인스턴스(per-user 학습 — 매 잡 pull)
  dataspace_docs_repo: /app/dataspace_docs     # 설계 문서
  # 위 3개 레포의 clone 원본 URL(토큰 없는 형태). worker가 사용자 GitLab 토큰으로
  # clone(없으면)/pull(있으면)한다(app/repos.py). 비우면 그 레포 프로비저닝 skip+경고.
  orchestrator_repo_url: http://server.interxlab.io:30000/yhchoi/ai-dlc-orchestrator.git
  dlc_meta_repo_url: http://server.interxlab.io:30000/hansa/docs/dlc-meta.git
  dataspace_docs_repo_url: http://server.interxlab.io:30000/hansa/dataspace_docs.git
  workspace_dir: /app/workspace
  claude_bin: claude
  permission_mode: skip
  output_format: stream-json
  concurrency_per_worker: 1

# jira-auto-dispatcher — compose 정의 (central + 네트워크 + socket-proxy)
#
# central 서비스만 여기 선언한다. worker는 central이 온보딩 시 Docker SDK로
# 동적 spawn(app/spawner.py)하므로 compose에 고정 서비스로 두지 않는다.
#
# 계약 정합(반드시 유지 — spawner/config.example.yaml과 일치):
#   image           jira-auto-dispatcher:${JAD_INSTANCE:-latest}  (config.spawn.image)
#   network         ${JAD_INSTANCE:-jad}-net       (config.spawn.network)
#
# --- 한 호스트에 여러 인스턴스(평가·스테이징·프로덕션) ---
# 이름을 고정하던 자리(container_name·network name·volume name)는 전부 **인스턴스
# 접두어**로 파생한다. `.env` 의 `JAD_INSTANCE` 하나가 그 접두어이며 **미설정이면 `jad`**
# 이라 기존 배포는 한 글자도 달라지지 않는다. 같은 값이 central 컨테이너에 env 로도
# 들어가(아래) config 가 network·volume·워커 컨테이너 이름을 같은 접두어로 파생한다 —
# 그래서 compose 가 만든 이름과 central 이 부르는 이름이 어긋날 수 없다(app/naming.py).
#
#   # 두 번째 인스턴스: **별도 디렉토리**에 배포하고 .env 에 세 줄 추가
#   JAD_INSTANCE=jad-stg          # 컨테이너·네트워크·워크스페이스 볼륨·**이미지 태그** 접두어
#   JAD_PORT=8788                 # 관리 UI 포트(호스트 포트는 인스턴스마다 달라야 한다)
#   COMPOSE_PROJECT_NAME=jad-stg  # 상태 볼륨(jad-state) — 아래 ⚠️
#
# ⚠️ **이미지도 인스턴스 축이다.** 예전에는 여기에 `image: jira-auto-dispatcher:latest` 가
#    변수 없이 박혀 있어서, 두 번째 인스턴스를 빌드하면 **돌고 있는 첫 인스턴스의 워커
#    이미지가 통째로 바뀌었다**(이름 공간만 갈리고 실행 코드는 공유). 지금은 아래 앵커가
#    `jira-auto-dispatcher:${JAD_INSTANCE:-latest}` 로 파생하므로 `.env` 의 세 줄 외에
#    **더 적을 것이 없다** — JAD_INSTANCE 하나로 태그까지 갈린다(미설정이면 `latest`,
#    즉 기존 배포는 한 글자도 안 달라진다). 레지스트리 이미지를 쓰는 등 이름을 직접
#    정해야 하면 `.env` 에 `JAD_IMAGE=<repo>:<tag>` 를 주면 그게 이긴다.
#
# ⚠️ 서비스 키(`central`·`socket-proxy`)는 **바꾸지 않는다** — compose 네트워크 DNS 가
#    그 이름으로 돌고(DOCKER_HOST=tcp://socket-proxy:2375) 컨테이너 이름과 무관하다.
# ⚠️ **`JAD_INSTANCE` 로 갈리지 않는 것이 하나 있다 — 이름 없는 볼륨 `jad-state`.**
#    그건 compose **프로젝트명**으로만 갈리는데 프로젝트명의 기본값은 **디렉토리 이름**
#    이다. 즉 "별도 디렉토리"만으로는 부족하다 — 같은 레포를 한 번 더 클론하면(두 번째
#    인스턴스를 만드는 가장 자연스러운 방법) 디렉토리 이름이 같아 프로젝트명도 같아지고
#    `<프로젝트명>_jad-state` 를 **공유**한다. 거기엔 jobs·watermark·dedup·registry 가
#    들어 있어 두 인스턴스가 같은 티켓을 중복 처리하고 등록 사용자가 섞인다.
#    → 다중 인스턴스면 위처럼 `COMPOSE_PROJECT_NAME` 을 **반드시 함께** 나눠라.
#    (실측: `JAD_INSTANCE=jad-stg docker compose config` → jad-state 는 여전히
#     `<디렉토리이름>_jad-state`. `COMPOSE_PROJECT_NAME=jad-stg` 를 함께 주면
#     `jad-stg_jad-state` 로 갈린다.)
#    여기에 `name:` 을 박아 자동으로 갈라 주지 **않는** 이유는 아래 volumes 절 참조 —
#    기본값이 바뀌어 기존 배포의 상태가 통째로 유실된다.
#
# ⚠️ 보안: 관리 UI/워커는 도구권한 자율 에이전트(RCE 표면). 신뢰 네트워크 한정, 인터넷 노출 금지.
#          관리 UI 에는 **인증이 없다** — 포트에 닿는 것이 곧 권한이다(자격증명 등록·회전 포함).
#          docker.sock 직결은 호스트 root 동치 → 기본은 socket-proxy 경유(최소 권한). SECURITY.md.

# central·worker 공용 단일 이미지 이름 — **인스턴스에서 파생**(app/naming.py default_image).
# 앵커로 한 자리에만 적는다: `image:` 와 central 의 env `JAD_IMAGE` 가 반드시 같은 문자열
# 이어야 하기 때문이다(계약 A — 두 곳이 갈리면 spawner 가 남의 태그로 워커를 띄운다).
# tests/test_compose_contract.py 가 이 표현식과 naming.default_image() 의 드리프트를 잡는다.
x-jad-image: &jad_image ${JAD_IMAGE:-jira-auto-dispatcher:${JAD_INSTANCE:-latest}}

services:
  # --- (기본·권장) docker-socket-proxy: docker.sock 최소권한 완화책 ---
  # central은 docker.sock을 직접 마운트하지 않고 이 프록시의 TCP 엔드포인트로만
  # 접근한다. 아래 create/start/stop/inspect + 볼륨/네트워크에 필요한 범위만 노출.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ${JAD_INSTANCE:-jad}-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # 컨테이너 조회/생성/기동/중지/삭제(spawner 라이프사이클)
      IMAGES: 1       # containers.run 시 이미지 inspect
      NETWORKS: 1     # ${JAD_INSTANCE:-jad}-net 조회/연결
      VOLUMES: 1      # per-user 볼륨(<instance>-<username>) 조회/생성
      POST: 1         # 생성/기동 등 쓰기 메서드 허용(위 리소스 한정)
      EXEC: 1         # 프랙탈 PUSH 경로: central→worker `docker exec`(per-user sub가 워커에서 claude --resume). SECURITY.md §4 참조.
      # 그 외(SERVICES/SWARM/SECRETS/INFO 등)는 기본 0(비노출). EXEC은 위와 같이 프랙탈 푸시용으로 명시 허용.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jad-net

  central:
    build: .
    image: *jad_image                    # spawner가 worker를 이 이미지로 띄운다(env JAD_IMAGE 로 전달)
    container_name: ${JAD_INSTANCE:-jad}-central
    restart: unless-stopped
    # ⚠️ 좀비 프로세스 방지: central 의 PID 1 도 `python -m app.main`(ENTRYPOINT)이다.
    #    central 은 레포-리졸버 등에서 claude 를 spawn할 수 있어 워커와 동일한 고아
    #    reparent 문제를 겪는다. init: true 로 tini 를 PID 1 에 주입해 고아를 reap한다
    #    (compose는 HostConfig.Init=true 로 번역 — 워커의 spawner init=True 와 동일 기전).
    init: true
    depends_on:
      - socket-proxy
    environment:
      ROLE: central
      SECRETS_DIR: /run/secrets              # config secrets.base_dir(${SECRETS_DIR})
      # ⚠️ CENTRAL_URL · WORKER_SHARED_SECRET 은 **더 이상 없다**. 워커가 중앙의 dispatch
      #    HTTP 를 폴링하던 시절의 값(폴링 대상 주소 · X-Worker-Secret 공유 시크릿)인데,
      #    그 서빙 표면과 폴링 소비자가 프랙탈 seam(중앙 → docker exec 푸시)으로 대체되며
      #    읽는 곳이 사라졌다. .env 에 남아 있어도 무시된다.
      # ⚠️ HOST_DEPLOY_DIR 도 **더 이상 없다**(설치자가 틀리기 쉬운 값이라 제거).
      #    워커에 거는 마운트는 전부 named 볼륨이고, config·시크릿·알림 웹훅은 central 이
      #    컨테이너 스펙에 **주입**해 워커가 자기 안에 기록한다(app/inject.py). 그래서
      #    호스트 절대경로를 아무도 알 필요가 없다. .env 에 남아 있어도 무시된다.
      # central 레포-리졸버(run.repo_resolution: llm)가 신규 티켓의 target_repos를
      # claude로 판단할 때 쓰는 central 자신의 인증 토큰(.env로 주입, 워커 per-user와 별개).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # 프랙탈 PUSH: central의 docker CLI가 socket-proxy를 타깃하도록 지정.
      # ⚠️ 정합 필수: config.yaml 의 deploy.docker_host 와 동일 값이어야 한다
      #    (기본값은 deploy.profile 에서 파생되며 세 프로파일 모두 이 값이다).
      DOCKER_HOST: tcp://socket-proxy:2375
      # 인스턴스 이름 — compose 가 위에서 컨테이너·네트워크·볼륨 이름을 지을 때 쓴 것과
      # **같은 값**을 central 에도 넣는다. config 가 이걸로 network·workspace 볼륨·워커
      # 컨테이너 이름을 파생하므로(deploy.instance 를 이긴다 — app/config.py), compose 가
      # 실제로 만든 이름과 central 이 부르는 이름이 어긋날 수 없다.
      JAD_INSTANCE: ${JAD_INSTANCE:-jad}
      # 워커 이미지 — **위 `image:` 와 같은 앵커**다. compose 가 실제로 빌드한 태그를
      # central 에 그대로 알려 주므로, config.yaml 의 spawn.image 에 옛 값이 남아 있어도
      # 실재하는 이름이 이긴다(app/config.py _apply_image_override). 이 한 줄이 없으면
      # "compose 는 :jad-stg 를 빌드했는데 spawner 는 :latest 로 띄운다"가 조용히 성립한다.
      JAD_IMAGE: *jad_image
    ports:
      - "${JAD_PORT:-8787}:8787"              # 관리 UI — ⚠️ **사내망/신뢰 네트워크 한정(외부 노출 금지)**.
      #                                        ⚠️ 이 콘솔에는 **인증이 없다.** 열려 있는 포트에 닿는 사람은 누구나
      #                                        사용자를 등록하고, 자격증명을 회전시키고(PUT /users/<u>/secrets —
      #                                        토큰을 서버 파일에 쓰고 worker 컨테이너를 재생성한다), 워커를
      #                                        기동·중지할 수 있다. 즉 **포트 자체가 유일한 접근 통제**다.
      #                                        공개 호스트면 "127.0.0.1:${JAD_PORT:-8787}:8787" 로 바꾸고 SSH 터널로 접근하라(INSTALL.md §4).
      #                                        한 호스트에 여러 인스턴스면 .env 의 JAD_PORT 를 인스턴스마다 다르게 준다(컨테이너 쪽 8787 은 고정).
    networks:
      - jad-net
    volumes:
      - jad-state:/app/state                 # jobs/watermark/dedup/registry 영속(명명 볼륨)
      - jad-workspace:/app/workspace         # 오케스트레이터 작업 공간(명명 볼륨)
      - ./config:/app/config:ro              # config.yaml(시크릿 값 아님, 파일 참조만)
      - ./secrets:/run/secrets               # 시크릿 파일(값). central은 온보딩으로 per-user 시크릿을 여기 쓴다(rw 필수). 이미지엔 굽지 말 것.
      #                                        ⚠️ 이 두 바인드는 **compose CLI 가 호스트에서** 해석하므로(central 자신의 마운트) 안전하다.
      #                                        워커 쪽은 다르다 — 워커는 호스트 데몬이 만들기 때문에 bind 를 쓰지 않고 주입으로 받는다(app/inject.py).
      # --- worker 동적 spawn을 위한 docker 접근 ---
      # (기본) 위 socket-proxy 경유 — central은 docker.sock을 직접 보지 않는다.
      #        ⚠️ **로컬(Docker Desktop) 포함 모든 프로파일의 기본**이다. 이 파일을 고칠
      #           일이 없다 — config.yaml 의 deploy.docker_host 도 tcp://socket-proxy:2375
      #           으로 파생된다(app/setup_schema.PROFILE_DEFAULTS).
      #
      # (대안) docker.sock 직결 — 편하지만 호스트 root 동치(특권 상승 표면, 비권장).
      #        socket-proxy 서비스/depends_on 제거 후 아래 한 줄을 추가하고
      #        config.yaml 에 deploy.docker_host: unix:///var/run/docker.sock 을 **명시**한다
      #        (명시 값이 프로파일 파생을 이긴다). ⚠️ 한쪽만 바꾸면 조용히 어긋난다.
      #   - /var/run/docker.sock:/var/run/docker.sock

  # --- worker(사용자별)는 compose에 없음 ---
  # central이 온보딩/관리 UI에서 Docker SDK로 동적 spawn 한다:
  #   같은 image(jira-auto-dispatcher:latest) · 같은 network(<instance>-net) ·
  #   ROLE=worker DISPATCH_USER=<user> · per-user 볼륨 <instance>-<username>(:/home/app/.claude) ·
  #   비-root(config.spawn.run_as, 기본 1000:1000). 상세는 app/spawner.py.
  #   컨테이너 이름은 <instance>-worker-<username>(app/naming.py 단일 원천).
  #   워커 마운트는 **named 볼륨 2개뿐**(<instance>-<user> · <instance>-workspace)이고 bind 는 없다.
  #   config·per-user 시크릿·알림 웹훅은 스폰 시 주입되어 워커의 tmpfs(/run/secrets)와
  #   /app/config 에 워커가 직접 기록한다.

networks:
  jad-net:                          # compose 키(서비스가 참조하는 이름) — 고정.
    name: ${JAD_INSTANCE:-jad}-net  # 실제 네트워크 이름 — central·socket-proxy·동적 worker가
    #                                 공유하는 사설망. spawner 는 config.spawn.network 의
    #                                 **이름**으로 워커를 여기 붙인다(계약 — 같은 접두어에서 파생).

volumes:
  jad-state:             # central 영속 상태
  jad-workspace:                          # 오케스트레이터 작업 공간(공유 워크스페이스 — 단일 클론)
    name: ${JAD_INSTANCE:-jad}-workspace  # ⚠️ 명시 이름 필수: spawner가 워커에 **같은 named 볼륨**을
    #                      이 이름으로 마운트한다(config.spawn.workspace_volume, 기본
    #                      jad-workspace) → central·모든 워커가 레포 한 벌 공유(설계 §4).
    #                      compose 프로젝트 프리픽스가 붙으면 워커 마운트명과 어긋나므로
    #                      name을 고정한다(jad-net과 동일 패턴). 인스턴스 접두어는 그 고정을
    #                      풀지 않고 **통째로 옮긴다** — 두 인스턴스가 워크스페이스를 공유하면
    #                      서로의 레포 클론·레포락 장부를 밟는다.
  # 참고: worker per-user 볼륨(<instance>-<username>)은 spawner가 런타임에 생성한다(여기 선언 안 함).
  # ⚠️ jad-state 만 name 을 고정하지 **않는다** — 여기에 ${JAD_INSTANCE:-jad}-state 를 박으면
  #    미설정 기본값이 `<프로젝트명>_jad-state` 에서 `jad-state` 로 **바뀌어**, 지금 돌고 있는
  #    배포가 jobs·watermark·dedup·registry 를 통째로 잃는다(빈 볼륨을 새로 만든다).
  #    compose 에는 "미설정이면 프로젝트 접두어, 설정하면 인스턴스 접두어"를 표현할 문법이
  #    없으므로, 인스턴스별 분리는 `.env` 의 COMPOSE_PROJECT_NAME 으로 한다(파일 상단 ⚠️).
  #    ↳ 그래서 이 값은 **자동으로 갈리지 않는다.** 다중 인스턴스를 쓰는 사람이 명시해야 한다.
